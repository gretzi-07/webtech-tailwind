<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Eventos</title>
    <style>
        html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
}

.footer {
    width: 100%;
    box-sizing: border-box;
    background-color: #1a1a1a;
    color: #d1d1d1;
    padding: 20px 20px 12px;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 0.8rem;
}

.footer-container {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.footer-section h3 {
    color: #ffffff;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 8px;
    border-bottom: 1px solid #333;
    padding-bottom: 4px;
}

.footer-section p {
    margin: 6px 0;
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 8px;
}

.footer-section a {
    color: #b3b3b3;
    text-decoration: none;
    transition: color 0.2s ease;
}

.footer-section a:hover {
    color: #ffffff;
}

.social-links {
    display: flex;
    gap: 8px;
    margin-top: 6px;
}

.social-links a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background-color: #2a2a2a;
    border-radius: 50%;
    color: #fff;
    transition: background-color 0.2s ease, transform 0.2s ease;
}

.social-links a:hover {
    background-color: #0066cc;
    transform: translateY(-2px);
}

.footer-bottom {
    max-width: 1100px;
    margin: 15px auto 0;
    padding-top: 10px;
    border-top: 1px solid #2a2a2a;
    text-align: center;
    font-size: 0.75rem;
    color: #777;
}
    </style>
</head>

<body>
    <footer class="footer"> <!-- footer sebas -->
        <div class="footer-container">
            <div class="footer-section">
                <h3>Contacto</h3>
                <p>
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="16" x="2" y="4" rx="2" />
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                    </svg>
                    <a href="mailto:GestiondeEventos@gmail.com">GestiondeEventos@gmail.com</a>
                </p>
                <p>
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                    </svg>
                    <a href="tel:+51987654321">+51 987 654 321</a>
                </p>
            </div>

            <div class="footer-section">
                <h3>Ubicación</h3>
                <p>
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>
                    Av. Principal 123, Oficina 402<br>Arequipa, Perú
                </p>
            </div>
          
            <div class="footer-section">
                <h3>Síguenos</h3>
                <div class="social-links">
                    <a href="#" aria-label="Facebook">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
                        </svg>
                    </a>
                    <a href="#" aria-label="Instagram">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2026 Gestión de Eventos.</p>
        </div>  
    </footer>
</body>

</html>
